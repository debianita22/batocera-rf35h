# I controlli veloci a ogni push e pull request (tools/ci-check.sh): script,
# loader, patch applicate a Batocera fissato, configurazione del target rf35h,
# DTB e moduli contro il kernel di Batocera, test di batocera-upgrade e del
# controllo dell'immagine. Pochi minuti, niente build.
name: Check

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Controlli
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Strumenti
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck squashfs-tools mtools device-tree-compiler \
            u-boot-tools fdisk zstd gcc-aarch64-linux-gnu flex bison bc libssl-dev \
            pkg-config libconfuse-dev dosfstools e2fsprogs >/dev/null
          pip install -q --break-system-packages actionlint-py

      - name: tools/ci-check.sh
        run: ./tools/ci-check.sh --work "${RUNNER_TEMP}/check"
